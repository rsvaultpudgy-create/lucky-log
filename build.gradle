plugins { id 'java' }
repositories {
    mavenLocal()
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex("net\\.runelite.*") } }
    mavenCentral()
}
def runeLiteVersion = 'latest.release'
// The Plugin Hub's dependency verification only allows Lombok up to 1.18.30, which is
// fine on the JDKs it builds with. Newer local JDKs (23+) need a newer Lombok to compile.
def lombokVersion = JavaVersion.current().majorVersion.toInteger() >= 23 ? '1.18.46' : '1.18.30'
dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}
group = 'com.pudgy.droptracker'
version = '1.2.1'
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release.set(11) }
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.pudgy.droptracker.DropTrackerTest'
    jvmArgs "-ea", "-Xmx768M"
    args "--developer-mode", "--debug"
}
